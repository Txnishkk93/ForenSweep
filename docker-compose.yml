services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forensweep
      POSTGRES_USER: forensweep
      POSTGRES_PASSWORD: forensweep-dev-only
    ports:
      - "55432:5432"
    volumes:
      - forensweep-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - forensweep-redis:/data

volumes:
  forensweep-postgres:
  forensweep-redis:
